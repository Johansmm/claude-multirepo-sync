[project]
name = "claude-multirepo-sync"
version = "0.1.0"
description = "Sync Claude Code configuration from a git repo you own"
requires-python = ">=3.10"
dependencies = ["filelock>=3.12"]

[project.scripts]
claude-mr-sync = "claude_multirepo_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_multirepo_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
