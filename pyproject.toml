[project]
name = "claude-multirepo-sync"
dynamic = ["version"]
description = "Sync Claude Code configuration from a git repo you own"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["filelock>=3.12"]

[project.scripts]
claude-mr-sync = "claude_multirepo_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_multirepo_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
